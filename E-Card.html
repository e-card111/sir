<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<title>Amol Shah - Digital Business Card</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--red:#C8102E;--ink:#111;--sub:#5b6170}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:#0b0e14;color:var(--ink);
    min-height:100vh;display:flex;justify-content:center;align-items:center;
    padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom));
    overflow-x:hidden;position:relative;perspective:1200px;
  }

  /* ---------- animated background ---------- */
  .bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  .blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;will-change:transform}
  .b1{width:55vmax;height:55vmax;left:-18vmax;top:-18vmax;background:radial-gradient(circle,#C8102E,transparent 65%);animation:float1 14s ease-in-out infinite}
  .b2{width:50vmax;height:50vmax;right:-20vmax;bottom:-20vmax;background:radial-gradient(circle,#2b4a8f,transparent 65%);animation:float2 17s ease-in-out infinite}
  .b3{width:30vmax;height:30vmax;left:40%;top:55%;background:radial-gradient(circle,rgba(200,16,46,.6),transparent 65%);animation:float3 20s ease-in-out infinite}
  @keyframes float1{50%{transform:translate(12vmax,10vmax) scale(1.15)}}
  @keyframes float2{50%{transform:translate(-14vmax,-8vmax) scale(1.1)}}
  @keyframes float3{50%{transform:translate(-10vmax,-12vmax) scale(.85)}}
  .dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.08) 1px,transparent 1px);background-size:26px 26px;mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%)}

  /* ---------- card ---------- */
  .stage{position:relative;z-index:1;width:100%;max-width:580px;transform-style:preserve-3d}
  .card{
    --rx:0deg;--ry:0deg;
    position:relative;width:100%;background:#fff;border-radius:18px;overflow:hidden;
    padding:30px 34px 28px;
    box-shadow:0 30px 60px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.06);
    transform:rotateX(var(--rx)) rotateY(var(--ry));
    transition:transform .15s ease-out,box-shadow .3s;
    animation:cardIn .9s cubic-bezier(.2,.8,.2,1) both;
    will-change:transform;
  }
  .card.idle{transition:transform .6s ease}
  @keyframes cardIn{from{opacity:0;transform:translateY(50px) scale(.94) rotateX(12deg)}to{opacity:1}}

  /* top accent line that draws itself */
  .top-line{position:absolute;top:0;left:0;height:5px;width:100%;background:linear-gradient(90deg,var(--red),#ff4d6a,var(--red));background-size:200% 100%;
    transform-origin:left;animation:line 1s .3s cubic-bezier(.2,.8,.2,1) both,slide 4s linear infinite}
  @keyframes line{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes slide{to{background-position:-200% 0}}

  /* glossy sheen sweep */
  .card::after{content:"";position:absolute;top:-50%;left:-60%;width:40%;height:200%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);
    transform:rotate(12deg);animation:sheen 5.5s 1.6s ease-in-out infinite;pointer-events:none}
  @keyframes sheen{0%{left:-60%}35%,100%{left:140%}}

  /* corner decoration */
  .corner{position:absolute;right:-60px;bottom:-60px;width:190px;height:190px;border-radius:50%;
    background:radial-gradient(circle,rgba(200,16,46,.14),transparent 70%);animation:pulse 4s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.25);opacity:.6}}

  /* logo */
  .logo-box{margin:6px 0 16px;opacity:0;animation:fadeUp .7s .5s ease-out forwards}
  .logo-img{display:block;max-height:54px;max-width:85%;width:auto;height:auto;object-fit:contain}

  /* text */
  .person-name{font-size:clamp(24px,5vw,31px);font-weight:800;letter-spacing:-.3px;color:var(--ink);
    display:inline-block;position:relative;padding-bottom:6px;
    clip-path:inset(0 100% 0 0);animation:reveal .9s .7s cubic-bezier(.2,.8,.2,1) forwards}
  .person-name::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:46px;background:var(--red);border-radius:3px;
    animation:grow 1s 1.4s ease-out both}
  @keyframes reveal{to{clip-path:inset(0 0 0 0)}}
  @keyframes grow{from{width:0}to{width:46px}}
  .position{margin:10px 0 18px;font-size:clamp(12px,2.6vw,15px);font-weight:700;color:var(--red);
    text-transform:uppercase;letter-spacing:1.6px;opacity:0;animation:fadeUp .7s 1s ease-out forwards}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  /* contacts */
  .contacts{display:flex;flex-direction:column;gap:10px}
  .contact-item{display:flex;align-items:center;gap:12px;text-decoration:none;color:#222;
    font-size:clamp(13px,3vw,15px);font-weight:600;padding:6px 8px 6px 0;border-radius:40px;
    opacity:0;animation:fadeUp .6s ease-out forwards;transition:color .2s,transform .2s;-webkit-tap-highlight-color:transparent}
  .contact-item:nth-child(1){animation-delay:1.15s}
  .contact-item:nth-child(2){animation-delay:1.3s}
  .icon{flex:none;width:34px;height:34px;border-radius:50%;background:#f1f1f3;display:grid;place-items:center;transition:background .25s,transform .25s}
  .icon svg{width:17px;height:17px;fill:none;stroke:var(--red);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:stroke .25s}
  .contact-item:hover,.contact-item:active{color:var(--red);transform:translateX(4px)}
  .contact-item:hover .icon,.contact-item:active .icon{background:var(--red);transform:rotate(-8deg) scale(1.08)}
  .contact-item:hover .icon svg,.contact-item:active .icon svg{stroke:#fff}
  .phone .icon{animation:ring 3.5s 2.5s ease-in-out infinite}
  @keyframes ring{0%,8%,100%{transform:rotate(0)}2%{transform:rotate(-16deg)}4%{transform:rotate(14deg)}6%{transform:rotate(-10deg)}}

  /* buttons */
  .actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;opacity:0;animation:fadeUp .7s 1.5s ease-out forwards}
  .btn{flex:1 1 140px;display:inline-flex;justify-content:center;align-items:center;gap:8px;text-decoration:none;cursor:pointer;
    font-weight:700;font-size:15px;line-height:1;font-family:inherit;padding:13px 16px;border-radius:12px;border:2px solid var(--red);
    transition:transform .2s,box-shadow .2s,background .2s,color .2s;position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent}
  .btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .btn.primary{background:var(--red);color:#fff;box-shadow:0 8px 20px rgba(200,16,46,.35);animation:glow 2.6s 2.4s ease-in-out infinite}
  .btn.ghost{background:#fff;color:var(--red)}
  .btn:hover{transform:translateY(-3px)}
  .btn.ghost:hover{background:var(--red);color:#fff}
  .btn:active{transform:scale(.96)}
  @keyframes glow{50%{box-shadow:0 8px 30px rgba(200,16,46,.65)}}
  .ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:rip .6s ease-out;pointer-events:none}
  @keyframes rip{to{transform:scale(4);opacity:0}}

  .tag{margin-top:16px;text-align:center;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:#9aa0ae;opacity:0;animation:fadeUp .7s 1.8s ease-out forwards}

  .toast{position:fixed;left:50%;bottom:max(28px,env(safe-area-inset-bottom));transform:translate(-50%,30px);z-index:5;
    background:#fff;color:#111;font-weight:600;font-size:14px;padding:12px 20px;border-radius:40px;box-shadow:0 10px 30px rgba(0,0,0,.4);
    opacity:0;pointer-events:none;transition:.35s}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media (min-width:481px){.card{padding:36px 40px 32px}}
  @media (max-width:480px){.card{padding:26px 22px 24px}}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition:none!important}
    .logo-box,.position,.contact-item,.actions,.tag{opacity:1}
    .person-name{clip-path:none}
  }
</style>
</head>

<script>
(function(){
  var card=document.getElementById('card'),stage=card.parentElement;
  var fine=window.matchMedia('(pointer:fine)').matches;

  /* 3D tilt on mouse / touch */
  function tilt(x,y){
    var r=stage.getBoundingClientRect();
    var px=(x-r.left)/r.width-.5, py=(y-r.top)/r.height-.5;
    card.classList.remove('idle');
    card.style.setProperty('--ry',(px*14)+'deg');
    card.style.setProperty('--rx',(-py*14)+'deg');
  }
  function reset(){card.classList.add('idle');card.style.setProperty('--rx','0deg');card.style.setProperty('--ry','0deg')}
  if(fine){
    document.addEventListener('mousemove',function(e){tilt(e.clientX,e.clientY)});
    document.addEventListener('mouseleave',reset);
  }else{
    card.addEventListener('touchmove',function(e){var t=e.touches[0];tilt(t.clientX,t.clientY)},{passive:true});
    card.addEventListener('touchend',reset);
  }

  /* ripple on buttons */
  document.querySelectorAll('.btn').forEach(function(b){
    b.addEventListener('click',function(e){
      var r=b.getBoundingClientRect(),s=Math.max(r.width,r.height),sp=document.createElement('span');
      sp.className='ripple';sp.style.width=sp.style.height=s+'px';
      sp.style.left=(e.clientX-r.left-s/2)+'px';sp.style.top=(e.clientY-r.top-s/2)+'px';
      b.appendChild(sp);setTimeout(function(){sp.remove()},600);
    });
  });

  /* Save Contact (.vcf) */
  var toast=document.getElementById('toast');
  document.getElementById('save').addEventListener('click',function(){
    var v=['BEGIN:VCARD','VERSION:3.0','N:Shah;Amol;;;','FN:Amol Shah',
      'ORG:JK Maini Precision Technology','TITLE:Head - Engineering',
      'TEL;TYPE=CELL:+919960269539','EMAIL:amol.shah@raymond.in','END:VCARD'].join('\r\n');
    var blob=new Blob([v],{type:'text/vcard'}),url=URL.createObjectURL(blob);
    var a=document.createElement('a');a.href=url;a.download='Amol-Shah.vcf';document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url)},2000);
    toast.classList.add('show');setTimeout(function(){toast.classList.remove('show')},2200);
  });
})();
</script>
