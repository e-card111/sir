<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amol Shah - Digital Business Card</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #0d1117;
            background-image: radial-gradient(at 0% 0%, rgba(200, 16, 46, 0.25) 0px, transparent 50%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Classic Business Card Aspect Ratio Box */
        .card {
            width: 100%;
            max-width: 580px;
            aspect-ratio: 1.75 / 1;
            background: #ffffff;
            border-radius: 14px;
            padding: 32px 36px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 25px 50px rgba(200, 16, 46, 0.2);
        }

        /* Top Red Accent Line */
        .top-line {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: #C8102E;
        }

        /* Company Logo */
        .logo-box {
            margin-bottom: 10px;
        }

        .logo-img {
            max-height: 52px;
            max-width: 80%;
            width: auto;
            object-fit: contain;
        }

        /* Content Area */
        .person-name {
            font-size: clamp(20px, 4vw, 26px);
            font-weight: 800;
            color: #111111;
            margin-bottom: 2px;
        }

        .position {
            font-size: clamp(12px, 2.2vw, 15px);
            font-weight: 700;
            color: #C8102E;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 14px;
        }

        /* Clickable Contacts */
        .contacts {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .contact-item {
            display: inline-flex;
            align-items: center;
            text-decoration: none;
            color: #222222;
            font-size: clamp(12px, 2vw, 14px);
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .icon {
            width: 24px;
            height: 24px;
            background: #f0f0f0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            margin-right: 10px;
        }

        .contact-item:hover {
            color: #C8102E;
        }

        @media (max-width: 480px) {
            .card {
                aspect-ratio: auto;
                padding: 24px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="top-line"></div>

        <!-- Logo -->
        <div class="logo-box">
            <img src="logo.png" alt="JK Maini Precision Technology" class="logo-img">
        </div>

        <!-- Details -->
        <div>
            <h1 class="person-name">Amol Shah</h1>
            <div class="position">Head - Engineering</div>

            <div class="contacts">
                <a href="tel:+919960269539" class="contact-item">
                    <span class="icon">📞</span> +91 9960269539
                </a>
                <a href="mailto:amol.shah@raymond.in" class="contact-item">
                    <span class="icon">✉️</span> amol.shah@raymond.in
                </a>
            </div>
        </div>
    </div>

</body>
</html>
